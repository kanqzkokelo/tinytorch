name: nightly

# Quiet-hours schedule: 04:00 UTC. Manual trigger via `workflow_dispatch`
# is also wired for ad-hoc regression runs.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Nightly runs are not cancelled on the same ref — a failed nightly is
# evidence, not noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Mirror the day-job baseline first so a broken CI doesn't get masked
  # by a slow nightly. The `long-tests` job runs after these pass.
  lint-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Syntax check every src
        run: |
          mkdir -p build/ci_logs
          rc=0
          for f in src/*.c; do
            gcc -std=c11 -fsyntax-only -DTT_IN_LIB -Iinclude -Isrc \
              "$f" 2>&1 | tee "build/ci_logs/syntax-$(basename "$f").log" || rc=1
          done
          exit $rc

  build-gcc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc libgomp1
      - name: Compile all objects
        run: |
          mkdir -p build/obj
          rc=0
          for f in src/*.c; do
            gcc -O1 -mavx2 -mfma -fopenmp -std=c11 -fPIC -DTT_IN_LIB \
              -Iinclude -Isrc -c "$f" -o "build/obj/$(basename "${f%.c}").o" || rc=1
          done
          exit $rc

  long-tests:
    runs-on: ubuntu-22.04
    needs: [lint-compile, build-gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain + numpy
        run: |
          sudo apt-get update && sudo apt-get install -y gcc python3-numpy
      - name: Build cpu_backend binary (long-tests consume it)
        run: |
          gcc -O3 -mavx2 -mfma -fopenmp -std=c11 -Iinclude \
            -DCPU_BACKEND_MAIN -o build/cpu_backend src/cpu_backend.c -lm

      # The expensive ones. Each is allowed to fail individually so the
      # other regressions still surface in the same run.
      - name: engine golden (3 models x 3 prompts, minutes)
        id: engine-golden
        continue-on-error: true
        run: |
          python3 tests/test_engine_golden.py verify 2>&1 \
            | tee build_nightly_engine_golden.log
      - name: samplers conformance (5000 cases, ~10s)
        id: samplers-conformance
        continue-on-error: true
        run: |
          python3 tests/test_samplers_conformance.py 2>&1 \
            | tee build_nightly_samplers_conformance.log
      - name: cpu_backend multi-shape sweep
        id: cpu-backend-sweep
        continue-on-error: true
        run: |
          python3 tests/test_cpu_backend.py 2>&1 \
            | tee build_nightly_cpu_backend.log

      # Aggregate: if ANY of the three regressed, fail the job. This is the
      # notification path (red badge in GH PR checks + email if subscribed).
      - name: Gate on regression
        if: always() && (steps.engine-golden.outcome == 'failure' || steps.samplers-conformance.outcome == 'failure' || steps.cpu-backend-sweep.outcome == 'failure')
        run: |
          echo "::error::Nightly regression detected:"
          [ "${{ steps.engine-golden.outcome }}" = "failure" ]       && echo " - engine_golden"
          [ "${{ steps.samplers-conformance.outcome }}" = "failure" ] && echo " - samplers_conformance"
          [ "${{ steps.cpu-backend-sweep.outcome }}" = "failure" ]    && echo " - cpu_backend_sweep"
          exit 1

      - name: Upload long-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: build_nightly_*.log
          if-no-files-found: warn
